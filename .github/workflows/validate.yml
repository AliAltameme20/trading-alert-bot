name: Monthly validation

# Re-measures every setup's out-of-sample edge across ~1,200 liquid stocks. Only cells that
# pass can produce live signals; results older than 45 days switch every signal off.
on:
  schedule:
    - cron: "17 14 1-7 * 6"   # first Saturday of the month
  workflow_dispatch:

concurrency:
  group: daily-signals        # never overlaps a signals run writing the same repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_PERSIST: "1"
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          node --max-old-space-size=6144 scripts/validate.js --send
